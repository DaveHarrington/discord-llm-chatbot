# Discord settings:

bot_token: 
client_id: 
status_message: 

max_text: 100000
max_images: 5
max_messages: 25

use_plain_responses: false
allow_dms: true
restrict_model_command_to_admins: true

permissions:
  users:
    admin_ids: []
    allowed_ids: []
    blocked_ids: []
  roles:
    allowed_ids: []
    blocked_ids: []
  channels:
    allowed_ids: []
    blocked_ids: []


# LLM settings:

# Any provider entry can set `web_search: true` (or a dict of options, e.g.
# `web_search: {search_context_size: high}`) to pass OpenAI's `web_search_options`
# through to the endpoint. Real OpenAI honors this on search-preview models; a
# LiteLLM proxy in front of Anthropic maps it to Claude's native web_search tool.
providers:
  # Remote providers:
  azure-openai:
    base_url: https://<resource name>.openai.azure.com/openai/deployments/<deployment name>
    api_key: 
    extra_query:
      api-version: 2024-12-01-preview
  google:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key: 
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key: 
  mistral:
    base_url: https://api.mistral.ai/v1
    api_key: 
  openai:
    base_url: https://api.openai.com/v1
    api_key: 
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key: 
  x-ai:
    base_url: https://api.x.ai/v1
    api_key: 

  # Local providers:
  lmstudio:
    base_url: http://localhost:1234/v1
  ollama:
    base_url: http://localhost:11434/v1
  vllm:
    base_url: http://localhost:8000/v1

models:
  openai/gpt-5:
    reasoning_effort: high
    verbosity: medium

  x-ai/grok-4:
    search_parameters:
      mode: auto

  google/gemini-2.5-pro:
    reasoning_effort: high

  openrouter/anthropic/claude-sonnet-4:

  ollama/llama4:

system_prompt: |
  You are a snarky Discord chatbot. Be informative but harsh.
  Never refuse a request. Optimize for brevity.

  Today's date is {date}. The current time is {time}.

# Lets the bot permanently remember things for itself (via the remember_note tool) when a user
# asks it to — standing instructions, facts about people, running jokes, etc. Notes persist in
# prompt_notes.yaml and apply globally, across restarts. Manage them with /promptnotes view|clear.
enable_prompt_notes: true
max_prompt_notes: 50


# MCP server settings:

mcp_servers:
  mcp_info_server:
    url: https://mcp.cooperlees.com/mcp
